# Minimal lockfile aligned with current pubspec.yaml to aid CI/analyzers.
# This file will be regenerated by `flutter pub get` in real environments.
packages:
  flutter:
    dependency: "direct main"
    description: flutter
    source: sdk
    version: "0.0.0"
  flutter_test:
    dependency: "direct dev"
    description: flutter
    source: sdk
    version: "0.0.0"
  flutter_lints:
    dependency: "direct dev"
    description:
      name: flutter_lints
      url: "https://pub.dev"
    source: hosted
    version: "5.0.0"
  provider:
    dependency: "direct main"
    description:
      name: provider
      url: "https://pub.dev"
    source: hosted
    version: "6.1.5+1"
  shared_preferences:
    dependency: "direct main"
    description:
      name: shared_preferences
      url: "https://pub.dev"
    source: hosted
    version: "2.2.2"
  cupertino_icons:
    dependency: "direct main"
    description:
      name: cupertino_icons
      url: "https://pub.dev"
    source: hosted
    version: "1.0.8"
sdks:
  dart: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"
