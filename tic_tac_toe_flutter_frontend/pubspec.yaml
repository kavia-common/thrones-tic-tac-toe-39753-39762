# flutter_project_root: true
name: tic_tac_toe_flutter_frontend
description: "Thrones Tic Tac Toe - Flutter app with Ocean Professional theme, accessibility, and subtle animations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.5+1
  # Persistence for scores
  shared_preferences: ^2.2.2
  # Optional icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Explicit asset list for icons used in the board tiles.
  assets:
    - assets/
    - assets/icons/
    - assets/icons/got_x.png
    - assets/icons/got_o.png
